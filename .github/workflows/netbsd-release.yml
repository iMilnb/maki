# Watch upstream maki releases and build NetBSD binaries for each new one.
#
# GitHub offers no push-based trigger for another repository's releases, so this
# polls on a schedule. It must live on the fork's default branch: scheduled
# workflows only run from there.
#
# The build itself is release.yml, which this job kicks by pushing the upstream
# tag onto NETBSD_BRANCH's merge commit -- that ref carries the NetBSD port fix
# upstream does not have yet.
name: Watch upstream releases

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: tontinton/maki
  NETBSD_BRANCH: netbsd-build

jobs:
  netbsd-for-new-release:
    name: Build NetBSD for new upstream release
    runs-on: ubuntu-latest
    steps:
      - name: Find the newest upstream release
        id: latest
        run: |
          # public repo: no auth needed, and the job token is scoped to this
          # fork anyway
          upstream_json=$(curl -fsSL \
            "https://api.github.com/repos/$UPSTREAM/releases/latest")
          tag=$(printf '%s' "$upstream_json" | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if printf '%s' "$upstream_json" | jq -e '[.assets[]?.name] | map(select(test("netbsd"))) | length > 0'; then
            echo "$tag already ships NetBSD binaries upstream, nothing to build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fork_json=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          if printf '%s' "$fork_json" | jq -e '[.assets[]?.name] | map(select(test("netbsd"))) | length > 0'; then
            echo "$tag already built for NetBSD on this fork, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out ${{ env.NETBSD_BRANCH }}
        if: steps.latest.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NETBSD_BRANCH }}
          fetch-depth: 0

      - name: Merge ${{ steps.latest.outputs.tag }} and tag it
        if: steps.latest.outputs.skip != 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --tags --quiet upstream

          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "$TAG is already merged into $NETBSD_BRANCH"
          else
            git merge --no-ff -m "merge upstream $TAG" "$TAG"
          fi

          # HEAD:, not the branch name: checkout of a non-default ref can leave
          # a detached HEAD, which would push the stale branch tip instead
          git push origin "HEAD:refs/heads/$NETBSD_BRANCH"
          # triggers release.yml, which builds only the NetBSD targets
          git push -f origin "$TAG:refs/tags/$TAG"
